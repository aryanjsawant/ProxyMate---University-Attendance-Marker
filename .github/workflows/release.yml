name: Release

# Push a tag to publish a release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Builds the APKs on GitHub's runners and attaches them to a GitHub Release, so
# binaries never have to be committed to the repo.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # The screenshot suite is excluded: it renders goldens, which are for
      # documentation rather than regression, and would fail CI on any
      # deliberate UI tweak.
      - name: Test
        run: flutter test --exclude-tags screenshots

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      # The Play upload artefact. Built unsigned here — CI has no keystore, and
      # putting one in repo secrets is a bigger risk than signing locally for
      # the handful of uploads this app will see. Attached so the exact commit
      # that produced a release is reproducible.
      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Name the artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             dist/proxymate-${{ github.ref_name }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             dist/proxymate-${{ github.ref_name }}-arm32.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## Install

            Download **`proxymate-${{ github.ref_name }}-arm64.apk`** — that is
            the right one for essentially every phone made since 2017. Use the
            `arm32` build only if the arm64 one refuses to install.

            Open the file on your phone, allow installs from that source, and
            tap Install. Android may warn that the app is unrecognised; that is
            normal for anything not distributed through the Play Store.
